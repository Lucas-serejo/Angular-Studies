<div class="container">
  <header>
    <h1>User List</h1>
    
    <input 
      type="text" 
      placeholder="Search by name, email or role" 
      [(ngModel)]="searchTerm" 
      (input)="filterUsers()"
    >
  </header>

  <div class="grid">
    @for (u of filteredUsers; track u.id) {
      
      <app-user-card [user]="u"></app-user-card>

    } @empty {
      <div class="alert">
        <p>No Users Found</p>
      </div>
    }
  </div>

</div>
